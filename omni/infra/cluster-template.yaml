kind: Cluster
name: router-gateway
talos:
  version: v1.9.2
kubernetes:
  version: 1.31.4
features:
  enableWorkloadProxy: true
patches:
  - name: cni
    file: patches/cni.yaml
  - name: certs
    file: patches/certs.yaml
  - name: dnsDomain
    file: patches/dnsDomain.yaml
  - name: nameservers
    file: patches/nameservers.yaml
  - name: sysctls
    file: patches/sysctls.yaml
---
kind: ControlPlane
machines:
  - 30303031-3030-3030-3131-663636336130
patches:
  - name: cilium
    file: patches/cilium.yaml
  - name: argocd
    file: patches/argocd.yaml
  - name: monitoring
    file: patches/monitoring.yaml
  - name: workloads
    inline:
      cluster:
        allowSchedulingOnControlPlanes: true
---
kind: Machine
name: 30303031-3030-3030-3131-663636336130
install:
  disk: /dev/mmcblk0
patches:
  - name: rpi-400
    file: rpi400.yaml