cluster:
  extraManifests:
    # Install the Kubelet Serving Certificate Approver and metrics-server during bootstrap.
    # The following two lines should only be part of the Cluster Config of the node that will handle the bootstrap process.
    - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
    - https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
machine:
  network:
    hostname: kaar
    interfaces:
      - addresses:
          - 10.42.0.58/24
        dhcp: false
        interface: eth0
        routes:
          - gateway: 10.42.0.1
            network: 0.0.0.0/0